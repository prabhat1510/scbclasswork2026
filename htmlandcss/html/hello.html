<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello HTML Page</title>
    <!-- external styling-->
    <link rel="stylesheet" href="../css/hello.css">
    <style>
        /* Internal styling */
        h2 {
            color: darkgreen;
        }
        ul{
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: darkblue;
        }
    </style>
      
</head> 
<body>
    <h1>Hello, World!</h1>
    <!-- Inline styling example-->
    <p style="color: blue; background-color: lightgray;">This is my first HTML page.</p>
    <p id="p1">Good Afternoon!</p>
    <p id="p2" class="c1">Hope you had a good time during the break!</p>
    <p id="p3" class="c1">This is another paragraph.</p>
    <h2>List of my favorite programming languages:</h2>
    <ul>
        <li>Python</li>
        <li>JavaScript</li>
        <li>Java</li>
        <li>C++</li>
    </ul>
</body>
</html>
