<!DOCTYPE html>
<html>
    <head>
        <title>Box Model</title>
        <style>
                span.a {
                    display: inline; /* the default for span */
                    padding: 5px;
                    border: 2px solid red;  
                }

                span.b {
                    display: inline-block;
                    width: 100px;
                    height: 35px;
                    padding: 5px;
                    border: 2px solid red;    
                }

                span.c {
                    display: block;
                    width: 100px;
                    height: 35px;
                    padding: 5px;
                    border: 2px solid red;    
}
        </style>
    </head>
    <body>
            <div>Hello All <span class="a">How you all doing?</span></div>
            <div>Hello All <span class="b">How you all doing?</span></div>
            <div>Hello All <span class="c">How you all doing?</span></div>
    </body>
</html>
