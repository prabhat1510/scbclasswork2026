<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            /*Positon property examples*/
            .box-static {
                position: static;
                width: 200px;
                height: 100px;
                background-color: lightblue;
            }
            .box-relative {
                position: relative;
                top: 120px;
                left: 130px;
                width: 200px;
                height: 100px;
                background-color: lightgreen;
            }

            .box-absolute {
                position: absolute;
                top: 50px;
                left: 50px;
                width: 200px;
                height: 100px;
                background-color: lightcoral;
            }
            .box-fixed {
                position: fixed;
                top: 10px;
                right: 110px;
                width: 200px;
                height: 100px;
                background-color: lightgoldenrodyellow;
            }
        </style> 
    </head> 
    <body>
        <div class="box-static">
            Static Position
        </div>
        <div class="box-relative">
            Relative Position
        </div>
        <div class="box-absolute">
            Absolute Position
        </div>
        <div class="box-fixed">
            Fixed Position
        </div>

    </body>
</html>
