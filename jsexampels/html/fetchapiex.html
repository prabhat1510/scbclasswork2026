    async function loadUser() {

    try {

        const response =
            await fetch("https://jsonplaceholder.typicode.com/users/1");

        if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
        }

        const user = await response.json();

        console.log(user);

    } catch (error) {

        console.log("Error:", error.message);

    }
}

    </script>
